<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英検 動詞トレーナー</title>
<meta name="description" content="例文の英→日・日→英で動詞を覚える学習アプリ">
<meta name="theme-color" content="#1b2333">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one study column; on the answer screen the etymology panel opens as a right column (wide) or a bottom sheet (phone) */
:root{
  --paper:#f7f8fa; --card:#ffffff; --ink:#1b2333; --muted:#5d6577; --line:#dfe3ea;
  --red:#d6322b; --mark:#fde3e0; --ok:#1f8a5b; --ok-soft:#dff3ea; --bad-soft:#fde8e6; --ety:#f3efe6; --ety-ink:#5a4a2c; --shade:rgba(15,20,30,.35);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161f; --card:#1b212d; --ink:#e9ecf2; --muted:#9aa3b5; --line:#2c3443;
  --red:#ff6b62; --mark:#43262a; --ok:#4cc38a; --ok-soft:#173327; --bad-soft:#3a2224; --ety:#2a2620; --ety-ink:#e6d5b0; --shade:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161f; --card:#1b212d; --ink:#e9ecf2; --muted:#9aa3b5; --line:#2c3443;
  --red:#ff6b62; --mark:#43262a; --ok:#4cc38a; --ok-soft:#173327; --bad-soft:#3a2224; --ety:#2a2620; --ety-ink:#e6d5b0; --shade:rgba(0,0,0,.55); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.installBar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.wrap{max-width:1000px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end;justify-content:space-between;margin-bottom:16px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1{font-weight:700;font-size:clamp(20px,4.5vw,26px);margin:0;text-wrap:balance}
.progress{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.progress b{font-family:var(--mono);color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.btn{font-weight:700;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--red);border-color:var(--red);color:#fff}
.btn.ety{background:var(--ety);color:var(--ety-ink);border-color:var(--ety)}
.btn.ety[aria-pressed="true"]{outline:2px solid var(--ety-ink);outline-offset:-2px}
.kbd{font-family:var(--mono);font-size:11px;opacity:.7;margin-left:6px}
.say{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.say:hover{color:var(--ink)}

/* start */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:18px;max-width:640px;margin:0 auto}
.field{display:flex;flex-direction:column;gap:8px}
.field>span{font-size:13px;font-weight:700;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--paper);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);max-width:100%}
.note{font-size:12px;color:var(--muted);margin:0}
.voiceRow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.voiceRow select{flex:1;min-width:0}

/* quiz */
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.stage.with-ety{grid-template-columns:minmax(0,1fr) minmax(0,340px)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.qtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dirtag{font-family:var(--body);font-weight:700;color:var(--red)}
.sentence{font-size:clamp(19px,4vw,24px);line-height:1.55;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.sentence .txt{min-width:0;flex:1}
.en{font-family:var(--display);font-weight:500}
.en u{text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--red);font-weight:700}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px;font-weight:700}
.prompt{padding:6px 0 2px}
.hint{font-family:var(--display);font-size:18px;color:var(--muted);letter-spacing:.02em}
.ans{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.wordbox{background:var(--paper);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.whead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.word{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.01em;line-height:1.2}
.ipa{font-family:var(--mono);font-size:13px;color:var(--muted)}
.freq{font-size:11px;font-weight:700;color:var(--red);border:1px solid var(--red);border-radius:999px;padding:0 8px;line-height:18px}
.meaning{color:var(--red);font-weight:700;font-size:17px}
.pos{display:inline-block;font-size:11px;border:1px solid var(--muted);color:var(--muted);border-radius:3px;padding:0 4px;margin-right:6px;line-height:16px;vertical-align:1px}
.derivs{display:flex;flex-direction:column;gap:2px;font-size:14px}
.derivs b{font-family:var(--display);margin-right:6px}
.derivs .ja{color:var(--red)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.actions .grow{flex:1}
.checks{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.checks i{width:12px;height:12px;border:1.5px solid var(--muted);border-radius:2px;display:inline-block}
.checks i.on{background:var(--ok);border-color:var(--ok)}

/* etymology */
.etyPanel{background:var(--ety);color:var(--ety-ink);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;animation:slide .22s ease-out;min-width:0}
.etyPanel h2{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.etyPanel h2 .word{font-size:22px}
.etyPanel p{margin:0;line-height:1.85}
.etyPanel .parts{font-family:var(--mono);font-size:13px;background:rgba(255,255,255,.35);border-radius:8px;padding:8px 10px}
.close{background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--ety-ink);padding:4px 8px;display:none}
@keyframes slide{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.shade{display:none}
@media (max-width:820px){
  .stage.with-ety{grid-template-columns:minmax(0,1fr)}
  .etyPanel{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:16px 16px 0 0;max-height:70vh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.2);
    padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
  .close{display:block}
  .shade{display:block;position:fixed;inset:0;background:var(--shade);z-index:19}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
}

/* result */
.result{text-align:center;align-items:center}
.score{font-family:var(--display);font-weight:800;font-size:56px;line-height:1}
.missed{width:100%;text-align:left;display:flex;flex-direction:column}
.missed div{padding:10px 0;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:2px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="installBar" id="installBar" hidden>
    <span>ホーム画面に追加すると、アプリとして起動できます。</span>
    <button class="btn primary" id="installBtn" style="padding:6px 14px">ホーム画面に追加</button>
  </div>
  <header>
    <div>
      <div class="eyebrow">Chapter 1 · No.0001–0024</div>
      <h1>単語問題で狙われる動詞</h1>
    </div>
    <div class="progress">
      <span>3回クリア <b id="pDone">0</b>/24</span>
      <span>苦手 <b id="pWeak">0</b></span>
    </div>
  </header>
  <main id="app"></main>
</div>

<script>
/* 例文・訳・語源メモはこのアプリ用に新しく作成したもの */
const WORDS=[
 {n:1,w:"predict",ipa:"pridíkt",m:"予言する・予測する",d:[["prediction","名","予言・予報"]],
  en:"Experts predict that prices will rise next year.",hl:"predict",ja:"専門家は来年物価が上がると【予測している】。",
  parts:"pre（前に）＋ dict（言う）",ety:"起こる前に言ってしまう、というのが元の形。dict は「言う」で、dictionary（ことばを集めた本）、dictate（書き取らせる）、contradict（反対のことを言う）も同じ仲間です。"},
 {n:2,w:"concentrate",ipa:"kánsəntrèit",m:"集中する",f:1,d:[["concentration","名","集中"]],
  en:"I can't concentrate on my homework with the TV on.",hl:"concentrate",ja:"テレビがついていると宿題に【集中】できない。",
  parts:"con（共に）＋ centr（中心）＋ -ate（動詞）",ety:"散らばっているものを一つの中心に寄せ集めるイメージ。気持ちを一点に寄せるので「集中する」。concentrate on 〜 の形で出ることが多いです。"},
 {n:3,w:"shorten",ipa:"ʃɔ́ːrtn",m:"短くする",d:[["short","形","短い"],["shortly","副","すぐに・手短に"]],
  en:"The new bridge will shorten the trip to the airport.",hl:"shorten",ja:"新しい橋で空港までの道のりが【短くなる】。",
  parts:"short（短い）＋ -en（〜にする）",ety:"-en は形容詞を「〜にする」という動詞に変える語尾。widen（広げる）、sharpen（鋭くする）、strengthen（強くする）も同じ作りです。"},
 {n:4,w:"respond",ipa:"rispánd",m:"応答する・反応する",f:1,d:[["response","名","返答・反応"]],
  en:"She didn't respond to my email.",hl:"respond",ja:"彼女は私のメールに【返事をし】なかった。",
  parts:"re（返して）＋ spond（約束する・誓う）",ety:"相手のことばに対して、こちらからことばを返すイメージ。respond to 〜「〜に応える」で覚えましょう。correspond（一致する・文通する）も spond の仲間です。"},
 {n:5,w:"imitate",ipa:"ímətèit",m:"まねる",d:[["imitation","名","まね・模造品"]],
  en:"Young children often imitate their parents.",hl:"imitate",ja:"幼い子どもはよく親の【まねをする】。",
  parts:"ラテン語 imitari（写しをつくる）",ety:"image（姿・像）と同じ根っこをもつ語で、「相手の姿を写し取る」感覚。名詞の imitation は「本物に似せた物＝模造品」の意味でもよく使われます。"},
 {n:6,w:"lift",ipa:"líft",m:"持ち上げる・高める",f:1,d:[],
  en:"Can you help me lift this heavy box?",hl:"lift",ja:"この重い箱を【持ち上げる】のを手伝ってくれる？",
  parts:"古ノルド語 lypta（空中に上げる）",ety:"イギリス英語ではエレベーターのことを lift と言います。物だけでなく、気分を上げる（lift one's spirits）や、禁止を解く（lift a ban）にも使えます。"},
 {n:7,w:"assist",ipa:"əsíst",m:"手伝う",d:[["assistance","名","援助"],["assistant","名","助手"]],
  en:"The nurse assisted the doctor during the operation.",hl:"assisted",ja:"手術の間、看護師が医師を【補助した】。",
  parts:"as（＝ad そばに）＋ sist（立つ）",ety:"相手のそばに立って支えるイメージ。sist「立つ」は insist（上に立って言い張る）、resist（立ち向かう）、consist（共に立つ→成り立つ）にも入っています。"},
 {n:8,w:"observe",ipa:"əbzə́ːrv",m:"よく見る・観察する",f:1,d:[["observation","名","観察"],["observer","名","観察者・立会人"]],
  en:"We observed the stars through a telescope.",hl:"observed",ja:"私たちは望遠鏡で星を【観察した】。",
  parts:"ob（〜に向かって）＋ serve（見守る・保つ）",ety:"対象に注意を向けたまま見守り続けるイメージ。「（規則や習慣を）守る」という意味もあり、そちらの名詞は observance です。"},
 {n:9,w:"replace",ipa:"ripléis",m:"取り替える・切り替える",f:1,d:[["replacement","名","取り替え・後任"]],
  en:"We need to replace the old printer with a new one.",hl:"replace",ja:"古いプリンターを新しいものに【取り替える】必要がある。",
  parts:"re（再び）＋ place（置く）",ety:"同じ場所に別の物を置き直すイメージ。replace A with B「AをBと取り替える」の形が頻出で、Aが外され、Bが残ります。"},
 {n:10,w:"complete",ipa:"kəmplíːt",m:"完成させる／（形）完全な",f:1,d:[["completely","副","すっかり・完全に"]],
  en:"He completed the puzzle in just an hour.",hl:"completed",ja:"彼はたった1時間でパズルを【完成させた】。",
  parts:"com（すっかり）＋ plete（満たす）",ety:"すき間なく満たしきるイメージ。動詞「完成させる」と形容詞「完全な」が同じ形です。plenty（たくさん）、supply（補う）も「満たす」の仲間です。"},
 {n:11,w:"blame",ipa:"bléim",m:"責める・〜の責任にする",d:[["blame 人 for 〜","熟","〜のことで人を責める"],["be to blame for 〜","熟","〜の責任がある"]],
  en:"Don't blame yourself for the accident.",hl:"blame",ja:"その事故のことで自分を【責め】ないで。",
  parts:"ギリシャ語 blasphemein（悪く言う）",ety:"「悪く言う」が元の意味。for のあとに責める理由がきます。be to blame for 〜「〜の責任がある」という形も試験でねらわれます。"},
 {n:12,w:"account",ipa:"əkáunt",m:"説明する・占める／（名）口座",d:[["account for 〜","熟","〜を説明する・〜の割合を占める"]],
  en:"Tourism accounts for 30% of the island's income.",hl:"accounts",ja:"観光業が島の収入の30％を【占めている】。",
  parts:"ac（＝ad 〜へ）＋ count（数える）",ety:"数を数えて報告することから、「説明する」と「帳簿・口座」の意味が生まれました。account for 〜 は「説明する」と「（割合を）占める」の両方を押さえておきましょう。"},
 {n:13,w:"stare",ipa:"stéər",m:"じっと見つめる",d:[["stare at 〜","熟","〜をじっと見る"]],
  en:"The cat stared at the bird outside the window.",hl:"stared",ja:"猫は窓の外の鳥を【じっと見つめた】。",
  parts:"古英語 starian（目を見開いて見る）",ety:"目を大きく開いたまま視線を止めるイメージ。look at よりずっと長く強く見ることで、人に対して使うと「じろじろ見る」という失礼なニュアンスにもなります。"},
 {n:14,w:"conflict",ipa:"kənflíkt",m:"衝突する・矛盾する",d:[["conflict","名","争い・衝突・矛盾"]],
  en:"His story conflicts with the evidence.",hl:"conflicts",ja:"彼の話は証拠と【矛盾している】。",
  parts:"con（互いに）＋ flict（打つ）",ety:"互いに打ち合う→ぶつかる。意見や話がぶつかれば「矛盾する」です。名詞は CONflict（前にアクセント）、動詞は conFLICT（後ろにアクセント）。"},
 {n:15,w:"postpone",ipa:"poustpóun",m:"延期する",d:[],
  en:"The game was postponed because of heavy rain.",hl:"postponed",ja:"大雨のため試合は【延期された】。",
  parts:"post（後に）＋ pone（置く）",ety:"予定を後ろに置き直すイメージ。put off と同じ意味です。pone／pos は「置く」で、position（位置）、component（構成要素）も仲間です。"},
 {n:16,w:"dedicate",ipa:"dédikèit",m:"捧げる",f:1,d:[["dedication","名","献身"],["be dedicated to 〜","熟","〜に打ち込んでいる"]],
  en:"She dedicated her life to helping people in need.",hl:"dedicated",ja:"彼女は困っている人を助けることに人生を【捧げた】。",
  parts:"de（すっかり）＋ dic（言う・宣言する）",ety:"「これは〜のためのものだ」と宣言するイメージ。dedicate A to B「AをBに捧げる」。to は前置詞なので、後ろは名詞か動名詞（helping）になります。"},
 {n:17,w:"achieve",ipa:"ətʃíːv",m:"達成する",f:1,d:[["achievement","名","達成・業績"]],
  en:"He worked hard to achieve his dream.",hl:"achieve",ja:"彼は夢を【かなえる】ために一生懸命努力した。",
  parts:"古フランス語 a chief（頭・先端に至る）",ety:"chief（頭）と同じ語源で、最後の先端までたどり着くイメージ。achieve a goal（目標を達成する）、achieve success（成功を収める）の組み合わせで覚えましょう。"},
 {n:18,w:"emphasize",ipa:"émfəsàiz",m:"重視する・強調する",f:1,d:[["emphasis","名","強調・重視"]],
  en:"The teacher emphasized the importance of sleep.",hl:"emphasized",ja:"先生は睡眠の大切さを【強調した】。",
  parts:"emphasis（強調）＋ -ize（〜する）",ety:"ギリシャ語で「外にはっきり見せること」が元。emphasize the importance of 〜「〜の大切さを強調する」はライティングでもそのまま使えます。"},
 {n:19,w:"fascinate",ipa:"fǽsənèit",m:"魅了する・とりこにする",d:[["fascination","名","魅了・強い興味"],["fascinating","形","魅力的な"]],
  en:"The story of the old castle fascinated the children.",hl:"fascinated",ja:"古いお城の話は子どもたちを【夢中にさせた】。",
  parts:"ラテン語 fascinare（魔法をかける）",ety:"魔法にかけたように心を奪うイメージ。人が主語なら be fascinated by 〜「〜に魅了される」、物が主語なら fascinating「魅力的な」を使います。"},
 {n:20,w:"gather",ipa:"gǽðər",m:"集まる・集める",d:[],
  en:"People gathered in the square to watch the fireworks.",hl:"gathered",ja:"花火を見るために人々が広場に【集まった】。",
  parts:"together（一緒に）と同じ根っこ",ety:"「一か所にまとめる」が元の意味。人が集まる・物を集めるのほか、gather information（情報を集める）の形でもよく出ます。"},
 {n:21,w:"argue",ipa:"ɑ́ːrgjuː",m:"議論する・口論する",f:1,d:[["argument","名","議論・口論"]],
  en:"My brothers always argue about small things.",hl:"argue",ja:"兄たちはいつもささいなことで【口げんかをする】。",
  parts:"ラテン語 arguere（はっきり示す）",ety:"自分の考えをはっきり示し合うことから「議論する・言い争う」。argue with 人「人と言い争う」、argue that 〜「〜だと主張する」の2つの形を押さえましょう。"},
 {n:22,w:"identify",ipa:"aidéntəfài",m:"特定する・〜であると見分ける",f:1,d:[["identify A with B","熟","AをBと同一視する"],["identity","名","身元・自分らしさ"]],
  en:"The police identified the man from the camera footage.",hl:"identified",ja:"警察は防犯カメラの映像からその男を【特定した】。",
  parts:"ラテン語 idem（同じ）＋ -fy（〜にする）",ety:"「同じものだと確かめる」→「それが誰・何なのかをはっきりさせる」。ID カードの ID は identification（身元証明）の略です。"},
 {n:23,w:"celebrate",ipa:"séləbrèit",m:"祝う",d:[["celebration","名","お祝い"]],
  en:"We celebrated our team's victory with a party.",hl:"celebrated",ja:"私たちはパーティーをしてチームの勝利を【祝った】。",
  parts:"ラテン語 celeber（大勢が集まる・有名な）",ety:"大勢で集まって盛り上げるイメージ。celebrity（有名人）も同じ仲間です。celebrate の後ろはできごと（birthday, victory）。人を祝うときは congratulate 人 on 〜 を使います。"},
 {n:24,w:"launch",ipa:"lɔ́ːntʃ",m:"打ち上げる・開始する",d:[],
  en:"The company will launch a new smartphone next month.",hl:"launch",ja:"その会社は来月、新しいスマートフォンを【発売する】。",
  parts:"lance（やり）と同じ根っこ",ety:"やりを勢いよく投げ出すイメージ。ロケットを打ち上げる、新製品を世に出す（発売する）、事業やキャンペーンを開始する、とどれも「勢いよく送り出す」でつながります。"}
];

/* ---------- state ---------- */
const KEY="eiken-verbs-ch1-v2";
let S={checks:{},weak:{},voice:"",rate:.9,dir:"en",range:"all",order:"seq"};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(4,"0");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function updateProgress(){
  $("#pDone").textContent=WORDS.filter(x=>(S.checks[x.n]||0)>=3).length;
  $("#pWeak").textContent=WORDS.filter(x=>S.weak[x.n]).length;
}

/* ---------- English voice ---------- */
let voices=[];
const PREFER=[/natural/i,/online/i,/neural/i,/google us english/i,/samantha/i,/aria/i,/jenny/i,/guy/i,/google uk english/i,/daniel/i,/zira/i,/david/i];
function loadVoices(){
  try{voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));}catch(e){voices=[];}
  voices.sort((a,b)=>score(b)-score(a));
  if(!S.voice||!voices.find(v=>v.name===S.voice)){if(voices[0]){S.voice=voices[0].name;save();}}
  const sel=$("#voiceSel");if(sel)fillVoiceSel(sel);
}
function score(v){let s=0;PREFER.forEach((r,i)=>{if(r.test(v.name))s+=40-i*2;});if(/en[-_]US/i.test(v.lang))s+=5;if(!v.localService)s+=3;return s;}
function fillVoiceSel(sel){
  if(!voices.length){sel.innerHTML=`<option>英語の音声が見つかりません</option>`;sel.disabled=true;return;}
  sel.disabled=false;
  sel.innerHTML=voices.map(v=>`<option value="${esc(v.name)}" ${v.name===S.voice?"selected":""}>${esc(v.name.replace(/^Microsoft /,""))} (${v.lang})</option>`).join("");
}
try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}
loadVoices();
function speak(text){
  try{
    const u=new SpeechSynthesisUtterance(text);
    const v=voices.find(v=>v.name===S.voice)||voices[0];
    if(v){u.voice=v;u.lang=v.lang;}else{u.lang="en-US";}
    u.rate=S.rate;speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- start screen ---------- */
const seg=(key,opts)=>`<div class="seg" data-key="${key}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${S[key]===v}">${l}</button>`).join("")}</div>`;
function poolFor(range){return WORDS.filter(x=>range==="all"||(range==="freq"&&x.f)||(range==="weak"&&S.weak[x.n])||(range==="todo"&&(S.checks[x.n]||0)<3));}
function renderStart(){
  const cnt=poolFor(S.range).length;
  $("#app").innerHTML=`<div class="panel">
    <div class="field"><span>出題の向き</span>${seg("dir",[["en","英文 → 日本語訳"],["ja","日本語訳 → 英文"],["mix","両方を交互に"]])}</div>
    <div class="field"><span>範囲</span>${seg("range",[["all","全24語"],["freq","頻出のみ"],["weak","苦手のみ"],["todo","3回未クリア"]])}</div>
    <div class="field"><span>順番</span>${seg("order",[["seq","番号順"],["rand","ランダム"]])}</div>
    <div class="field"><span>英語の音声</span>
      <div class="voiceRow"><select id="voiceSel" aria-label="英語の音声"></select><button type="button" class="say" id="voiceTest">♪ 試聴</button></div>
      ${seg("rate",[[1,"ふつう"],[.9,"少しゆっくり"],[.75,"ゆっくり"]])}
      <p class="note">英語ネイティブの声だけを表示しています。名前に「Natural」「Online」が付く声（Edge）や「Google US English」（Chrome）が、より自然に聞こえます。</p>
    </div>
    <button class="btn primary" id="go" ${cnt?"":"disabled"}>${cnt?`スタート（${cnt}問）`:"この範囲には単語がありません"}</button>
  </div>`;
  fillVoiceSel($("#voiceSel"));
  $("#voiceSel").onchange=e=>{S.voice=e.target.value;save();speak("Experts predict that prices will rise next year.");};
  $("#voiceTest").onclick=()=>speak("Experts predict that prices will rise next year.");
  document.querySelectorAll(".seg").forEach(g=>g.onclick=e=>{
    const b=e.target.closest("button");if(!b)return;
    const k=g.dataset.key;S[k]=k==="rate"?+b.dataset.v:b.dataset.v;save();
    if(k==="rate")speak("concentrate");
    renderStart();
  });
  $("#go").onclick=startSession;
}

/* ---------- session ---------- */
let Q=null;
function startSession(){
  let items=poolFor(S.range);
  if(S.order==="rand")items=shuffle(items);
  Q={items:items.map((x,i)=>({x,dir:S.dir==="mix"?(i%2?"ja":"en"):S.dir,res:null})),i:0,shown:false,hint:false,ety:false};
  renderQ();
}
const enHTML=x=>esc(x.en).replace(esc(x.hl),`<u>${esc(x.hl)}</u>`);
const jaHTML=x=>esc(x.ja).replace(/【(.+?)】/,"<mark>$1</mark>");
const hintHTML=x=>esc(x.en).replace(esc(x.hl),`<b style="color:var(--red)">${x.hl[0]}${"_".repeat(x.hl.length-1).split("").join(" ")}</b>`);
const derivHTML=x=>x.d.length?`<div class="derivs">${x.d.map(([e,p,j])=>`<div><b>${esc(e)}</b><span class="pos">${p}</span><span class="ja">${esc(j)}</span></div>`).join("")}</div>`:"";
const checksHTML=n=>`<span class="checks" aria-label="クリア ${Math.min(S.checks[n]||0,3)}/3">${[0,1,2].map(i=>`<i class="${i<(S.checks[n]||0)?"on":""}"></i>`).join("")}</span>`;

function renderQ(){
  if(Q.i>=Q.items.length)return renderResult();
  const it=Q.items[Q.i],x=it.x,en=it.dir==="en";
  const prompt=en
    ?`<div class="sentence"><div class="txt en">${enHTML(x)}</div><button class="say" data-say="sent">♪ 発音</button></div>`
    :`<div class="sentence"><div class="txt">${jaHTML(x)}</div></div>
      ${Q.hint&&!Q.shown?`<div class="hint">${hintHTML(x)}</div>`:""}`;
  const answer=Q.shown?`
    <div class="ans">
      <span class="lbl">${en?"日本語訳":"英文"}</span>
      ${en?`<div class="sentence" style="font-size:19px"><div class="txt">${jaHTML(x)}</div></div>`
          :`<div class="sentence" style="font-size:20px"><div class="txt en">${enHTML(x)}</div><button class="say" data-say="sent">♪ 発音</button></div>`}
    </div>
    <div class="wordbox">
      <div class="whead"><span class="word">${x.w}</span><span class="ipa">[${x.ipa}]</span>${x.f?'<span class="freq">頻出</span>':""}<button class="say" data-say="word">♪</button></div>
      <div class="meaning"><span class="pos">動</span>${esc(x.m)}</div>
      ${derivHTML(x)}
    </div>`:"";
  const btns=Q.shown
    ?`<button class="btn ety" id="etyBtn" aria-pressed="${Q.ety}">語源<span class="kbd">E</span></button><span class="grow"></span>
      <button class="btn bad" id="ng">× 言えなかった<span class="kbd">1</span></button>
      <button class="btn good" id="ok">○ 言えた<span class="kbd">2</span></button>`
    :`${en?"":`<button class="btn" id="hintBtn" ${Q.hint?"disabled":""}>ヒント<span class="kbd">H</span></button>`}<span class="grow"></span>
      <button class="btn primary" id="show">答えを見る<span class="kbd">Space</span></button>`;
  const etyPanel=Q.shown&&Q.ety?`<div class="shade" id="shade"></div><aside class="etyPanel" aria-label="語源の説明">
      <h2><span><span class="eyebrow" style="color:inherit">語源・覚え方</span><br><span class="word">${x.w}</span></span><button class="close" id="etyClose" aria-label="閉じる">×</button></h2>
      <div class="parts">${esc(x.parts)}</div><p>${esc(x.ety)}</p></aside>`:"";
  $("#app").innerHTML=`<div class="stage ${Q.shown&&Q.ety?"with-ety":""}">
    <section class="qcard">
      <div class="qtop"><span><span class="dirtag">${en?"英 → 日":"日 → 英"}</span>　No.${pad(x.n)} ${checksHTML(x.n)}</span><span>${Q.i+1} / ${Q.items.length}</span></div>
      <div class="prompt">${prompt}</div>
      ${answer}
      <div class="actions">${btns}</div>
    </section>${etyPanel}</div>
    <p class="note" style="text-align:center;margin-top:14px"><button class="say" id="quit">やめてスタート画面へ</button></p>`;
  bindQ(it);
}
function bindQ(it){
  const x=it.x;
  document.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say==="word"?x.w:x.en));
  $("#quit").onclick=()=>{Q=null;renderStart();};
  if(!Q.shown){
    $("#show").onclick=reveal;
    const h=$("#hintBtn");if(h)h.onclick=()=>{Q.hint=true;renderQ();};
  }else{
    $("#etyBtn").onclick=toggleEty;
    $("#ok").onclick=()=>grade(true);
    $("#ng").onclick=()=>grade(false);
    const c=$("#etyClose");if(c)c.onclick=toggleEty;
    const s=$("#shade");if(s)s.onclick=toggleEty;
  }
}
function reveal(){Q.shown=true;renderQ();if(Q.items[Q.i].dir==="ja")speak(Q.items[Q.i].x.en);}
function toggleEty(){Q.ety=!Q.ety;renderQ();}
function grade(ok){
  const it=Q.items[Q.i],n=it.x.n;it.res=ok;
  if(ok){S.checks[n]=Math.min((S.checks[n]||0)+1,3);}else{S.weak[n]=1;}
  save();updateProgress();
  Q.i++;Q.shown=false;Q.hint=false;Q.ety=false;renderQ();
}
function renderResult(){
  const ok=Q.items.filter(it=>it.res).length,missed=Q.items.filter(it=>it.res===false);
  $("#app").innerHTML=`<div class="panel result">
    <span class="eyebrow">結果</span>
    <span class="score">${ok}<span style="font-size:24px;color:var(--muted)"> / ${Q.items.length}</span></span>
    <p style="margin:0">${missed.length?"× をつけた単語は「苦手」に入れました。":"すべて言えました！"}</p>
    ${missed.length?`<div class="missed">${missed.map(it=>`<div><span><span class="word" style="font-size:18px">${it.x.w}</span>　<span class="meaning" style="font-size:14px">${esc(it.x.m)}</span></span><span class="en" style="font-size:14px">${enHTML(it.x)}</span><span style="font-size:13px;color:var(--muted)">${jaHTML(it.x)}</span></div>`).join("")}</div>`:""}
    <div class="actions" style="justify-content:center">
      ${missed.length?`<button class="btn bad" id="retry">× の単語だけ解き直す</button>`:""}
      <button class="btn primary" id="home">スタート画面へ</button>
    </div></div>`;
  $("#home").onclick=()=>{Q=null;renderStart();};
  const r=$("#retry");if(r)r.onclick=()=>{
    Q={items:missed.map(it=>({x:it.x,dir:it.dir,res:null})),i:0,shown:false,hint:false,ety:false};renderQ();
  };
}

/* keyboard */
document.addEventListener("keydown",e=>{
  if(!Q||Q.i>=Q.items.length||e.target.closest("select"))return;
  const k=e.key.toLowerCase();
  if(!Q.shown){
    if(k===" "||k==="enter"){e.preventDefault();reveal();}
    else if(k==="h"&&Q.items[Q.i].dir==="ja"){Q.hint=true;renderQ();}
  }else{
    if(k==="1")grade(false);else if(k==="2")grade(true);
    else if(k==="e")toggleEty();
    else if(k==="escape"&&Q.ety)toggleEty();
  }
});

updateProgress();renderStart();

/* PWA: offline cache + install button */
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;$("#installBar").hidden=false;});
$("#installBtn").onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice;}catch(e){}deferredPrompt=null;$("#installBar").hidden=true;};
window.addEventListener("appinstalled",()=>{$("#installBar").hidden=true;});
/* Android: voices often arrive late — retry a few times */
let vTries=0;const vTimer=setInterval(()=>{if(voices.length||++vTries>10){clearInterval(vTimer);return;}loadVoices();},500);
</script>
</body>
</html>
